<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Self-test</title>
<meta name="robots" content="noindex">
</head>
<body>
<!--
  TEMPORARY. Drives the real signup form in a same-origin iframe so the whole
  capture path is exercised from the live origin: real page code, real counters,
  real network call. Deleted immediately after the test run.
-->
<h1>Self-test</h1>
<iframe id="f" src="../a/" width="900" height="1400" style="border:1px solid #ccc"></iframe>
<pre id="probe-out">running…</pre>
<script>
var out = [];
function log(s) {
  out.push(s);
  document.getElementById('probe-out').textContent = out.join('\n');
}
var f = document.getElementById('f');
f.addEventListener('load', function () {
  setTimeout(function () {
    var d, w;
    try { d = f.contentDocument; w = f.contentWindow; }
    catch (e) { log('FAIL cross-origin: ' + e.message); return; }

    if (/\/thanks\//.test(w.location.pathname)) {
      log('RESULT redirected-to-thanks  (submission accepted end-to-end)');
      return;
    }

    var form = d.getElementById('signup-form');
    if (!form) { log('FAIL no form found'); return; }

    log('form found; preview parked at scrollY=' + Math.round(w.scrollY) +
        ' reviewFrameScroll=' + (function () {
          try { return Math.round(d.getElementById('review-frame').contentWindow.scrollY); }
          catch (e) { return 'n/a'; }
        })());

    form.email.value = 'hen49-selftest@example.com';
    form.accounts.value = '3-4';
    log('filled: email=hen49-selftest@example.com accounts=3-4');

    d.getElementById('submit-btn').click();
    log('submit clicked; waiting for network…');

    var tries = 0;
    var iv = setInterval(function () {
      tries++;
      var here = w.location.pathname;
      if (/\/thanks\//.test(here)) {
        clearInterval(iv);
        log('RESULT redirected-to-thanks  (delivery accepted)');
        return;
      }
      var msg = d.getElementById('form-msg');
      var t = msg ? msg.textContent.trim() : '';
      if (t && t !== 'Sending…') {
        clearInterval(iv);
        log('RESULT message-shown: ' + t);
        return;
      }
      if (tries > 30) { clearInterval(iv); log('RESULT timeout, last msg=' + t); }
    }, 500);
  }, 2500);
});
</script>
</body>
</html>
